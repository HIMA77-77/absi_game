  if (pass !== "ABSI_20") return alert("كلمة السر غلط");

  adminLogged = true;
  document.getElementById("loginAdmin").style.display = "none";
  document.getElementById("lobby").style.display = "block";
}


// ====== بدء الجولة ======
function startGame(){
  if(players.length === 0){ alert("لا يوجد لاعبين"); return; }
  nextQuestion();
}

// ====== السؤال التالي ======
function nextQuestion(){
  if(questions.length === 0){ alert("انتهت كل الأسئلة!"); return; }
  timeLeft = 10;
  currentPlayerAnswers = {};
  currentQuestion = questions.splice(Math.floor(Math.random()*questions.length),1)[0];
  usedQuestions.push(currentQuestion);

  document.getElementById('game').style.display = 'block';
  document.getElementById('questionText').innerText = currentQuestion.question;

  const answersDiv = document.getElementById('answers');
  answersDiv.innerHTML = '';
  currentQuestion.answers.forEach((ans,i)=>{
    const btn = document.createElement('button');
    btn.innerText = ans;
    btn.onclick = ()=>registerAnswer(i, players[0]); // الربط المبسط للاعب واحد لتجربة
    answersDiv.appendChild(btn);
  });

  clearInterval(timerInterval);
  timerInterval = setInterval(()=>{
    timeLeft--;
    document.getElementById('timer').innerText = timeLeft;
    if(timeLeft <=0) clearInterval(timerInterval);
  },1000);
}

// ====== تسجيل الإجابة تلقائياً ======
function registerAnswer(index, playerName){
  if(currentPlayerAnswers[playerName]) return; // منع الإجابة أكثر من مرة
  currentPlayerAnswers[playerName] = index;

  // منح النقطة لأول إجابة صحيحة فقط
  const firstCorrect = Object.values(currentPlayerAnswers).indexOf(currentQuestion.correctIndex) === -1;
  if(firstCorrect && index === currentQuestion.correctIndex){
    scores[playerName] +=1;
    updateTop10();
  }
}

// ====== عرض الإجابة الصحيحة ======
function showAnswer(){
  alert("الإجابة الصحيحة: " + currentQuestion.answers[currentQuestion.correctIndex]);
}

// ====== تحديث Top10 ======
function updateTop10(){
  const top = Object.entries(scores).sort((a,b)=>b[1]-a[1]).slice(0,10);
  const topList = document.getElementById('topList');
  topList.innerHTML = '';
  top.forEach(([name,score])=>{
    const li = document.createElement('li');
    li.innerText = name + ": " + score;
    topList.appendChild(li);
  });
}
</script>
